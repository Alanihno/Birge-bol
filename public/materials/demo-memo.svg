<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300"><rect width="1000" height="1300" fill="#faf9f6"/><rect x="50" y="50" width="900" height="1200" rx="45" fill="white" stroke="#e7e3f0"/><g font-family="Arial,sans-serif" fill="#2d2a3e"><text x="100" y="145" font-size="38" font-weight="bold">birgebol · Будь рядом</text><text x="100" y="225" font-size="22" fill="#7760a9">ТЕХНИЧЕСКИЙ ДЕМОМАТЕРИАЛ</text><text x="100" y="320" font-size="34" font-weight="bold">Знакомство с памяткой</text><text x="100" y="400" font-size="25">1. Откройте демонстрационную памятку.</text><text x="100" y="470" font-size="25">2. Найдите материалы специалиста в приложении.</text><text x="100" y="540" font-size="25">3. Отметьте, удалось ли открыть материал.</text><text x="100" y="670" font-size="23">Это пример работы интерфейса,</text><text x="100" y="710" font-size="23">а не лечебное или коррекционное упражнение.</text><text x="100" y="830" font-size="23">Настоящие задания предоставляет специалист</text><text x="100" y="870" font-size="23">после индивидуальной оценки и модерации.</text><text x="100" y="1050" font-size="22" fill="#6b6680">Выполняйте задание так,</text><text x="100" y="1090" font-size="22" fill="#6b6680">как показал ваш специалист.</text></g></svg>
