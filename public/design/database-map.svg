<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Карта связей базы Birge Bol"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9b89bd"/></marker></defs><rect width="1200" height="900" fill="#faf9f6"/><text x="50" y="35" font-family="Arial" font-size="25" fill="#463657">Birge Bol · связи данных и экономия токенов</text><path d="M190 115L190 325" stroke="#9b89bd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M190 325L590 325" stroke="#9b89bd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M590 115L590 325" stroke="#9b89bd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M590 115L990 115" stroke="#9b89bd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M590 325L990 325" stroke="#9b89bd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M590 325L590 535" stroke="#9b89bd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M590 535L190 535" stroke="#9b89bd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M990 115L990 535" stroke="#9b89bd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M190 775L590 775" stroke="#9b89bd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M590 775L990 775" stroke="#9b89bd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><g transform="translate(450 280)"><rect width="285" height="90" rx="18" fill="#ded2ee" stroke="#cdbfdf"/><text x="18" y="36" font-family="Arial" font-size="19" fill="#463657">Заявка / приём</text><text x="18" y="64" font-family="Arial" font-size="13" fill="#6b6680">appointments: единый статус</text></g><g transform="translate(50 70)"><rect width="285" height="90" rx="18" fill="#fff" stroke="#cdbfdf"/><text x="18" y="36" font-family="Arial" font-size="19" fill="#463657">Родитель</text><text x="18" y="64" font-family="Arial" font-size="13" fill="#6b6680">auth.users + user_roles</text></g><g transform="translate(50 280)"><rect width="285" height="90" rx="18" fill="#fff" stroke="#cdbfdf"/><text x="18" y="36" font-family="Arial" font-size="19" fill="#463657">Несколько детей</text><text x="18" y="64" font-family="Arial" font-size="13" fill="#6b6680">children → parent_id</text></g><g transform="translate(450 70)"><rect width="285" height="90" rx="18" fill="#fff" stroke="#cdbfdf"/><text x="18" y="36" font-family="Arial" font-size="19" fill="#463657">Айгерим С.</text><text x="18" y="64" font-family="Arial" font-size="13" fill="#6b6680">specialists → owner_id</text></g><g transform="translate(850 70)"><rect width="285" height="90" rx="18" fill="#fff" stroke="#cdbfdf"/><text x="18" y="36" font-family="Arial" font-size="19" fill="#463657">Клиника</text><text x="18" y="64" font-family="Arial" font-size="13" fill="#6b6680">clinics + clinic_members</text></g><g transform="translate(850 280)"><rect width="285" height="90" rx="18" fill="#fff" stroke="#cdbfdf"/><text x="18" y="36" font-family="Arial" font-size="19" fill="#463657">Уведомления</text><text x="18" y="64" font-family="Arial" font-size="13" fill="#6b6680">notifications → parent_id</text></g><g transform="translate(450 490)"><rect width="285" height="90" rx="18" fill="#fff" stroke="#cdbfdf"/><text x="18" y="36" font-family="Arial" font-size="19" fill="#463657">Цели и задания</text><text x="18" y="64" font-family="Arial" font-size="13" fill="#6b6680">child_goals → task_assignments</text></g><g transform="translate(50 490)"><rect width="285" height="90" rx="18" fill="#fff" stroke="#cdbfdf"/><text x="18" y="36" font-family="Arial" font-size="19" fill="#463657">Дневник родителя</text><text x="18" y="64" font-family="Arial" font-size="13" fill="#6b6680">task_completions + reviews</text></g><g transform="translate(850 490)"><rect width="285" height="90" rx="18" fill="#fff" stroke="#cdbfdf"/><text x="18" y="36" font-family="Arial" font-size="19" fill="#463657">Мессенджеры</text><text x="18" y="64" font-family="Arial" font-size="13" fill="#6b6680">WhatsApp / Telegram</text></g><g transform="translate(50 730)"><rect width="285" height="90" rx="18" fill="#eef1e8" stroke="#cdbfdf"/><text x="18" y="36" font-family="Arial" font-size="19" fill="#463657">Только общий термин</text><text x="18" y="64" font-family="Arial" font-size="13" fill="#6b6680">без данных ребёнка</text></g><g transform="translate(450 730)"><rect width="285" height="90" rx="18" fill="#eef1e8" stroke="#cdbfdf"/><text x="18" y="36" font-family="Arial" font-size="19" fill="#463657">ИИ: объяснение</text><text x="18" y="64" font-family="Arial" font-size="13" fill="#6b6680">≈71–141 вход; выход &#8804;350</text></g><g transform="translate(850 730)"><rect width="285" height="90" rx="18" fill="#eef1e8" stroke="#cdbfdf"/><text x="18" y="36" font-family="Arial" font-size="19" fill="#463657">Кэш 24 часа</text><text x="18" y="64" font-family="Arial" font-size="13" fill="#6b6680">повторный запрос: 0 токенов</text></g><text x="50" y="670" font-family="Arial" font-size="19" fill="#463657">Запись, подтверждение, задания, переписка, сравнение: 0 LLM-токенов</text><text x="50" y="865" font-family="Arial" font-size="15" fill="#6b6680">Оценка входа приблизительная. Лимит выхода — не средний расход. Отправку в мессенджере подтверждает пользователь.</text></svg>